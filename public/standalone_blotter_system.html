<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blotter and Incident Reporting System - Barangay Sta. Ana, Pateros</title>
  <link rel="icon" type="image/png" href="/santa-ana-logo.png">
  <link rel="shortcut icon" type="image/png" href="/santa-ana-logo.png">
  <link rel="apple-touch-icon" href="/santa-ana-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0F172A',
              indigo: '#6366F1',
              pastel: '#CAE1F7',
              dark: '#18283D',
              surface: '#F8FAFC'
            }
          },
          fontFamily: {
            heading: ['Urbanist', 'sans-serif'],
            body: ['Poppins', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #F8FAFC;
      color: #18283D;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Urbanist', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 4px;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #print-modal-content, #print-modal-content * {
        visibility: visible;
      }
      #print-modal-content {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        box-shadow: none;
        border: none;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- ================= TOP HEADER / NAVBAR ================= -->
  <header id="main-header" class="hidden bg-white/95 backdrop-blur-md text-[#1E293B] sticky top-0 z-40 border-b border-slate-200/80 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Left: Logo + System Title (Clickable to Home/Dashboard) -->
        <div onclick="navigateHome()" class="flex items-center gap-3 cursor-pointer select-none group">
          <div class="w-10 h-10 rounded-full overflow-hidden flex items-center justify-center shrink-0 transition-transform group-hover:scale-105 border border-slate-200/60 shadow-xs">
            <img src="/santa-ana-logo.png" alt="Barangay Logo" class="w-full h-full object-contain" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%236366f1\' stroke-width=\'2\'><path d=\'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\'/></svg>'">
          </div>
          <div>
            <h1 class="text-[13px] sm:text-[15px] font-bold tracking-wide uppercase leading-tight text-[#1E293B] group-hover:text-blue-700 transition-colors font-heading">
              BLOTTER AND INCIDENT REPORTING SYSTEM
            </h1>
            <p class="text-[11px] text-[#64748B] font-medium">
              Barangay Sta. Ana, Pateros
            </p>
          </div>
        </div>

        <!-- Right: Role Nav Links + Bell + Gear Icon + Logout -->
        <div class="flex items-center gap-1.5 sm:gap-2.5 ml-auto">
          
          <!-- Navigation Links Container (Injected based on user role) -->
          <nav id="role-nav-links" class="hidden md:flex items-center gap-1 text-[13px] sm:text-[14px] font-heading font-medium"></nav>

          <!-- Notification Bell -->
          <div class="relative">
            <button onclick="toggleNotifDropdown(event)" class="p-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/10 relative transition-colors" title="Notifications">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
              <span id="notif-badge" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
            </button>

            <!-- Notification Dropdown -->
            <div id="notif-dropdown" class="hidden absolute right-0 top-11 w-80 bg-white rounded-xl shadow-xl border border-slate-200 text-slate-800 z-50 overflow-hidden text-xs">
              <div class="px-4 py-3 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                <span id="notif-count-text" class="font-bold text-slate-900">Notifications</span>
                <button onclick="markAllNotificationsRead()" class="text-slate-700 hover:text-slate-900 font-semibold">Mark all read</button>
              </div>
              <div id="notif-list" class="max-h-72 overflow-y-auto divide-y divide-slate-100"></div>
            </div>
          </div>

          <!-- Settings Dropdown (Gear Icon Only) -->
          <div class="relative">
            <button onclick="toggleSettingsDropdown(event)" id="settings-btn" class="p-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/10 transition-colors" title="Settings & Options">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>

            <!-- Settings Menu: Separate Pages -->
            <div id="settings-dropdown" class="hidden absolute right-0 top-11 w-56 bg-white rounded-xl shadow-xl border border-slate-200 text-slate-800 z-50 overflow-hidden py-1.5 text-[13px]">
              <button onclick="navigateTo('profile'); closeAllDropdowns();" class="w-full px-4 py-2 text-left font-medium text-slate-700 hover:bg-slate-50 hover:text-slate-900 flex items-center gap-2.5">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span>Profile</span>
              </button>
              <button onclick="navigateTo('preferences'); closeAllDropdowns();" class="w-full px-4 py-2 text-left font-medium text-slate-700 hover:bg-slate-50 hover:text-slate-900 flex items-center gap-2.5">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                <span>Preferences &amp; Notifications</span>
              </button>
              <button id="settings-report-issue-btn" onclick="navigateTo('report-issue'); closeAllDropdowns();" class="w-full px-4 py-2 text-left font-medium text-slate-700 hover:bg-slate-50 hover:text-amber-600 flex items-center gap-2.5 border-t border-slate-100 mt-1 pt-2">
                <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span>Report an Issue</span>
              </button>
            </div>
          </div>

          <!-- Redesigned Soft Red Outline Logout Button -->
          <button onclick="logout()" class="px-3 py-1.5 rounded-lg text-[13px] font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200/90 flex items-center gap-1.5 transition-all shadow-xs" title="Logout">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span class="hidden sm:inline">Logout</span>
          </button>

        </div>
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT WRAPPER ================= -->
  <main id="app-root" class="flex-1 pb-16"></main>

  <!-- ================= DOSSIER MODAL ================= -->
  <div id="dossier-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 overflow-y-auto">
    <div id="print-modal-content" class="bg-white rounded-2xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 relative my-6 text-slate-800">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-5">
        <h3 class="text-xl font-bold font-heading text-slate-900">Official Barangay Blotter Dossier</h3>
        <button onclick="closeDossierModal()" class="text-slate-500 hover:text-black p-1 text-2xl font-bold">&times;</button>
      </div>
      <div id="dossier-content" class="space-y-4 text-xs sm:text-sm"></div>
      <div class="flex items-center justify-end gap-3 pt-6 border-t border-slate-200">
        <button onclick="closeDossierModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-100 text-xs font-semibold">Close</button>
        <button onclick="window.print()" class="px-5 py-2 bg-[#6366F1] text-white rounded-lg hover:bg-indigo-700 text-xs font-semibold shadow-sm">Print Dossier</button>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    // ---------------- APP DATA STATE ----------------
    const state = {
      currentUser: null,
      activeTab: 'login',
      isRegisterMode: false,
      notifications: [
        { id: 1, title: 'Case Hearing Scheduled', message: 'Hearing set for Blotter BLT-2026-001 on May 12, 2026, 9:00 AM.', timestamp: '10 mins ago', read: false, target_role: 'resident' },
        { id: 2, title: 'New Incident Filed', message: 'Resident Juan Luna filed a new complaint BLT-2026-003.', timestamp: '1 hour ago', read: false, target_role: 'staff' },
        { id: 3, title: 'Case Investigation Assigned', message: 'Case BLT-2026-002 has been assigned to Kagawad for mediation.', timestamp: '3 hours ago', read: false, target_role: 'kagawad' },
        { id: 4, title: 'System Security Audit Completed', message: 'All blotter records archived and backup created successfully.', timestamp: '1 day ago', read: true, target_role: 'admin' },
        { id: 5, title: 'Executive Summary Generated', message: 'Monthly blotter incident trend analytics report is ready for review.', timestamp: '2 days ago', read: true, target_role: 'captain' }
      ],
      issueReports: [
        { id: 1, user_name: 'Juan Dela Cruz', user_email: 'resident@example.com', feature_name: 'Evidence File Upload', description: 'File upload takes long on slow mobile network.', created_at: '2026-05-04 10:30 AM' }
      ],
      users: [
        { id: 1, user_id: 'ADM-001', full_name: 'Administrator', email: 'admin@example.com', role: 'admin', status: 'active', phone: '09171112222', address: 'Barangay Hall' },
        { id: 2, user_id: 'CPT-001', full_name: 'Hon. Captain Roberto Reyes', email: 'captain@example.com', role: 'captain', status: 'active', phone: '09182223333', address: 'P. Rosales St.' },
        { id: 3, user_id: 'KAG-001', full_name: 'Kagawad Juan Dela Cruz', email: 'kagawad@example.com', role: 'kagawad', status: 'active', phone: '09193334444', address: 'Alley 1' },
        { id: 4, user_id: 'STF-001', full_name: 'Staff Officer Maria Santos', email: 'staff@example.com', role: 'staff', status: 'active', phone: '09204445555', address: 'Bgy Staff Quarters' },
        { id: 5, user_id: 'RES-001', full_name: 'Resident Pedro Cruz', email: 'resident@example.com', role: 'resident', status: 'active', phone: '09215556666', address: 'Blk 4 Lot 10, Pateros' }
      ],
      blotters: [
        { id: 1, blotter_id: 'BLT-2026-001', complainant_name: 'Juan Luna Dela Cruz', respondent_name: 'Jessie Santos', incident_type: 'Pisikal na Pananakit', incident_location: 'Alley 1 P Rosales St.', incident_datetime: '2026-05-02T14:00', status: 'investigating', reported_at: 'May 2, 2026 2:00 PM', official_name: 'Staff Officer Maria Santos' },
        { id: 2, blotter_id: 'BLT-2026-002', complainant_name: 'Ana Patricia Gonzales', respondent_name: 'Felipe Penduko', incident_type: 'Pagnanakaw', incident_location: 'Blk 2 Pateros Central', incident_datetime: '2026-05-01T10:30', status: 'pending', reported_at: 'May 1, 2026 10:30 AM', official_name: 'Staff Officer Maria Santos' },
        { id: 3, blotter_id: 'BLT-2026-003', complainant_name: 'Ricardo Morales', respondent_name: 'Carlito Dalisay', incident_type: 'Karahasang Domestiko', incident_location: 'Alley 5 Sta. Ana', incident_datetime: '2026-04-28T09:15', status: 'resolved', reported_at: 'Apr 28, 2026 9:15 AM', official_name: 'Kagawad Juan Dela Cruz' }
      ],
      schedules: [
        { id: 1, blotter_id: 'BLT-2026-001', complainant_name: 'Juan Luna Dela Cruz', respondent_name: 'Jessie Santos', incident_type: 'Pisikal na Pananakit', schedule_date: '2026-05-12T09:00', location: 'Barangay Mediation Hall' },
        { id: 2, blotter_id: 'BLT-2026-002', complainant_name: 'Ana Patricia Gonzales', respondent_name: 'Felipe Penduko', incident_type: 'Pagnanakaw', schedule_date: '2026-05-14T14:00', location: 'Barangay Session Room' }
      ],
      currentDossier: null,
      systemSettings: {
        emailNotification: true,
        requireApproval: true,
        maintenanceMode: false,
        autoArchivePeriod: '90 days',
        lastBackupDate: 'April 26, 2026'
      },
      activityLogs: [
        { id: 1, text: 'Admin logged in', time: '4/27/2026, 12:01:53 PM', user: 'Admin' },
        { id: 2, text: 'System started', time: '4/27/2026, 12:01:53 PM', user: 'System' }
      ]
    };

    function toggleSystemSetting(key) {
      state.systemSettings[key] = !state.systemSettings[key];
      renderApp();
    }

    function setArchivePeriod(val) {
      state.systemSettings.autoArchivePeriod = val;
    }

    function saveSystemSettings() {
      alert('System configuration saved successfully!');
    }

    function createBackup() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute('href', dataStr);
      downloadAnchor.setAttribute('download', 'staana_blotter_backup.json');
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      state.systemSettings.lastBackupDate = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      state.activityLogs.unshift({
        id: Date.now(),
        text: 'Database backup downloaded',
        time: new Date().toLocaleString(),
        user: state.currentUser ? state.currentUser.full_name : 'Admin'
      });
      renderApp();
    }

    function clearDatabase() {
      if (confirm('Are you sure you want to clear all blotter and log data?')) {
        state.blotters = [];
        state.activityLogs = [{ id: Date.now(), text: 'Database cleared by administrator', time: new Date().toLocaleString(), user: 'Admin' }];
        renderApp();
      }
    }

    // ---------------- DROPDOWN CONTROLS ----------------
    function toggleNotifDropdown(e) {
      e.stopPropagation();
      const dd = document.getElementById('notif-dropdown');
      const settingsDd = document.getElementById('settings-dropdown');
      settingsDd.classList.add('hidden');
      dd.classList.toggle('hidden');
      renderNotifications();
    }

    function toggleSettingsDropdown(e) {
      e.stopPropagation();
      const dd = document.getElementById('settings-dropdown');
      const notifDd = document.getElementById('notif-dropdown');
      notifDd.classList.add('hidden');
      dd.classList.toggle('hidden');
    }

    function closeAllDropdowns() {
      document.getElementById('notif-dropdown').classList.add('hidden');
      document.getElementById('settings-dropdown').classList.add('hidden');
    }

    window.addEventListener('click', () => closeAllDropdowns());

    // ---------------- NOTIFICATIONS ----------------
    function getRoleNotifications() {
      if (!state.currentUser) return [];
      return state.notifications.filter(n => {
        if (n.target_role === 'all') return true;
        if (n.target_role === state.currentUser.role) return true;
        if (['admin', 'captain', 'kagawad'].includes(state.currentUser.role)) {
          return ['staff', 'admin', 'all'].includes(n.target_role);
        }
        return false;
      });
    }

    function renderNotifications() {
      const list = document.getElementById('notif-list');
      const notifs = getRoleNotifications();
      const unread = notifs.filter(n => !n.read).length;
      
      const badge = document.getElementById('notif-badge');
      if (unread > 0) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      document.getElementById('notif-count-text').innerText = `Notifications (${unread} unread)`;

      if (notifs.length === 0) {
        list.innerHTML = `<div class="p-4 text-center text-slate-400">No notifications.</div>`;
        return;
      }

      list.innerHTML = notifs.map(n => `
        <div onclick="markNotifRead(${n.id})" class="p-3 hover:bg-slate-50 cursor-pointer ${n.read ? 'opacity-70 bg-white' : 'bg-indigo-50/40'}">
          <div class="flex justify-between font-bold text-slate-900 mb-0.5">
            <span>${n.title}</span>
            <span class="text-[10px] text-slate-400">${n.timestamp}</span>
          </div>
          <p class="text-slate-600 leading-snug">${n.message}</p>
        </div>
      `).join('');
    }

    function markNotifRead(id) {
      const n = state.notifications.find(x => x.id === id);
      if (n) n.read = true;
      renderNotifications();
    }

    function markAllNotificationsRead() {
      state.notifications.forEach(n => n.read = true);
      renderNotifications();
    }

    // ---------------- NAVIGATION ----------------
    function navigateTo(tab) {
      state.activeTab = tab;
      renderApp();
    }

    function navigateHome() {
      if (!state.currentUser) {
        navigateTo('login');
        return;
      }
      const roleMap = {
        admin: 'user-management',
        captain: 'captain-dashboard',
        kagawad: 'kagawad-investigate',
        staff: 'staff-dashboard',
        resident: 'resident-home'
      };
      navigateTo(roleMap[state.currentUser.role] || 'staff-dashboard');
    }

    function loginAs(role) {
      const user = state.users.find(u => u.role === role);
      if (user) {
        state.currentUser = user;
        navigateHome();
      }
    }

    function logout() {
      state.currentUser = null;
      state.activeTab = 'login';
      renderApp();
    }

    // ---------------- DOSSIER MODAL ----------------
    function openDossier(blotterId) {
      const record = state.blotters.find(b => b.blotter_id === blotterId);
      if (!record) return;
      state.currentDossier = record;
      const c = document.getElementById('dossier-content');
      c.innerHTML = `
        <div class="text-center pb-3 border-b border-slate-200">
          <div class="text-xs uppercase font-bold text-slate-500">Republic of the Philippines • Barangay Sta. Ana, Pateros</div>
          <div class="text-lg font-bold text-[#0F172A] font-heading mt-1">OFFICIAL BLOTTER ENTRY REPORT</div>
          <div class="text-xs font-mono text-indigo-600 font-bold">${record.blotter_id}</div>
        </div>
        <div class="grid grid-cols-2 gap-4 py-2">
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
            <span class="block text-slate-400 font-semibold text-[11px]">NAG-UULAT (COMPLAINANT)</span>
            <span class="font-bold text-slate-900 text-sm">${record.complainant_name}</span>
          </div>
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
            <span class="block text-slate-400 font-semibold text-[11px]">INAANGKIN NA NASASANGKOT (RESPONDENT)</span>
            <span class="font-bold text-slate-900 text-sm">${record.respondent_name}</span>
          </div>
        </div>
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-1">
          <div><strong class="text-slate-500">Uri ng Insidente:</strong> <span class="font-semibold text-slate-900">${record.incident_type}</span></div>
          <div><strong class="text-slate-500">Lugar:</strong> <span class="text-slate-800">${record.incident_location}</span></div>
          <div><strong class="text-slate-500">Petsa at Oras:</strong> <span class="text-slate-800">${record.incident_datetime || record.reported_at}</span></div>
          <div><strong class="text-slate-500">Status:</strong> <span class="px-2 py-0.5 rounded text-[11px] font-bold uppercase ${record.status === 'resolved' ? 'bg-emerald-100 text-emerald-800' : 'bg-indigo-100 text-indigo-800'}">${record.status}</span></div>
        </div>
      `;
      document.getElementById('dossier-modal').classList.remove('hidden');
    }

    function closeDossierModal() {
      document.getElementById('dossier-modal').classList.add('hidden');
    }

    // ---------------- RESET PASSWORD (ADMIN FEATURE) ----------------
    function handleAdminResetPassword(userId) {
      const u = state.users.find(x => x.id === userId);
      if (u) {
        alert(`Password for user ${u.full_name} (${u.email}) has been reset to: Pateros@2026`);
        renderApp();
      }
    }

    // ---------------- SUBMIT BUG REPORT ----------------
    function submitIssueReport(e) {
      e.preventDefault();
      const feat = document.getElementById('report-feature-input').value;
      const desc = document.getElementById('report-desc-input').value;
      const fileInput = document.getElementById('report-screenshot-input');
      if (!feat || !desc) return;

      const finishSubmit = (screenshotData) => {
        state.issueReports.unshift({
          id: Date.now(),
          user_name: state.currentUser.full_name,
          user_email: state.currentUser.email,
          feature_name: feat,
          description: desc,
          screenshot: screenshotData || null,
          created_at: new Date().toLocaleString()
        });
        alert('Your issue report (with screenshot) has been submitted to the Administrators. Thank you!');
        navigateTo('report-issue');
      };

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          finishSubmit(evt.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        finishSubmit(null);
      }
    }

    // ---------------- MAIN RENDER ENGINE ----------------
    function renderApp() {
      const header = document.getElementById('main-header');
      const root = document.getElementById('app-root');
      const roleNav = document.getElementById('role-nav-links');
      const reportIssueBtn = document.getElementById('settings-report-issue-btn');

      if (!state.currentUser || state.activeTab === 'login') {
        header.classList.add('hidden');
        root.innerHTML = renderLoginRegisterView();
        return;
      }

      header.classList.remove('hidden');
      renderNotifications();

      // Rule: For Admin, Settings dropdown hides "Report Issue"
      if (state.currentUser.role === 'admin') {
        reportIssueBtn.classList.add('hidden');
      } else {
        reportIssueBtn.classList.remove('hidden');
      }

      // Render role nav links
      roleNav.innerHTML = getRoleNavButtons();

      // Render active screen
      if (state.activeTab === 'profile' || state.activeTab === 'settings' || state.activeTab === 'account') {
        root.innerHTML = renderProfileView();
      } else if (state.activeTab === 'preferences' || state.activeTab === 'notifications') {
        root.innerHTML = renderPreferencesView();
      } else if (state.activeTab === 'report-issue') {
        root.innerHTML = renderReportIssueView();
      } else if (state.currentUser.role === 'admin') {
        root.innerHTML = renderAdminPortal();
      } else if (state.currentUser.role === 'captain') {
        root.innerHTML = renderCaptainPortal();
      } else if (state.currentUser.role === 'kagawad') {
        root.innerHTML = renderKagawadPortal();
      } else if (state.currentUser.role === 'staff') {
        root.innerHTML = renderStaffPortal();
      } else if (state.currentUser.role === 'resident') {
        root.innerHTML = renderResidentPortal();
      }
    }

    function getRoleNavButtons() {
      const role = state.currentUser.role;
      const tab = state.activeTab;
      const btn = (name, target) => `
        <button onclick="navigateTo('${target}')" class="px-3.5 py-1.5 rounded-full transition-all text-xs sm:text-sm ${tab === target ? 'bg-[#CAE1F7] text-[#1E3A8A] font-semibold shadow-xs' : 'text-[#64748B] hover:bg-slate-100 hover:text-[#1E293B] font-medium'}">
          ${name}
        </button>
      `;

      if (role === 'admin') {
        return btn('User Management', 'user-management') + btn('Issue Reports', 'issue-reports') + btn('System Settings', 'system-settings');
      }
      if (role === 'captain') {
        return btn('Dashboard', 'captain-dashboard') + btn('Analytics', 'captain-analytics') + btn('Report', 'captain-report');
      }
      if (role === 'resident') {
        return btn('Home', 'resident-home') + btn('My Complaints', 'resident-complaints') + btn('My Schedule', 'resident-schedules');
      }
      if (role === 'staff') {
        return btn('Dashboard', 'staff-dashboard') + btn('Create Report', 'staff-create-report') + btn('All Incidents', 'staff-all-incident') + btn('Schedule', 'staff-schedule');
      }
      if (role === 'kagawad') {
        return btn('Investigate', 'kagawad-investigate') + btn('My Schedule', 'kagawad-schedule');
      }
      return '';
    }

    function autoSaveStandaloneForm() {
      try {
        const comp = document.getElementById('staff-comp-name')?.value || '';
        const resp = document.getElementById('staff-resp-name')?.value || '';
        if (comp || resp) {
          localStorage.setItem('standalone_create_report_draft', JSON.stringify({ comp, resp }));
        }
      } catch (e) {}
    }

    function clearStandaloneDraft() {
      try {
        localStorage.removeItem('standalone_create_report_draft');
      } catch (e) {}
    }

    function handleStaffCreateSubmit() {
      const comp = document.getElementById('staff-comp-name')?.value;
      const resp = document.getElementById('staff-resp-name')?.value;
      if (!comp || !resp) {
        alert('Please fill in complainant and respondent names.');
        return;
      }
      clearStandaloneDraft();
      const newId = 'BLT-2026-00' + (state.blotters.length + 1);
      state.blotters.unshift({
        id: Date.now(),
        blotter_id: newId,
        complainant_name: comp,
        respondent_name: resp,
        incident_type: 'Pisikal na Pananakit',
        incident_location: 'Barangay Sta. Ana, Pateros',
        incident_datetime: new Date().toISOString(),
        status: 'pending',
        reported_at: new Date().toLocaleString(),
        official_name: state.currentUser.full_name
      });
      alert(`Report created successfully! Case ID: ${newId}`);
      navigateTo('staff-all-incident');
    }
