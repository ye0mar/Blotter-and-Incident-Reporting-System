<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barangay Management System</title>
    <link rel="stylesheet" href="css/Schedules.css" />
    <link rel="stylesheet" href="css/top-nav.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

</head>
<body>
    <!-- Single Unified Top Navigation Bar (Image 1 Style) -->
    <nav class="top-header-navbar">
        <div class="top-header-left">
            <img class="top-header-logo" src="assets/Santa ANA logo - Edited - Edited.png" alt="Barangay Seal" />
            <div class="top-header-title-box">
                <h1>BARANGAY MANAGEMENT SYSTEM</h1>
                <p>Barangay Sta. Ana, Pateros — Blotter Module</p>
            </div>
        </div>
        <div class="top-header-nav-links">
            <a href="All Incident.html" class="top-nav-link">All Incidents</a>
            <a href="Create Report.html" class="top-nav-link">Create Report</a>
            <a href="Schedules.html" class="top-nav-link active">My Schedule</a>
            <a href="javascript:void(0)" onclick="openAccountModal()" class="top-nav-link">Account</a>
            <a href="javascript:void(0)" onclick="handleLogout()" class="top-nav-link logout-link">Logout</a>
        </div>
    </nav>

    <!-- ========== LAYOUT ========== -->
    <div class="layout" style="display:block; max-width: 1400px; margin: 0 auto; width: 100%; padding: 20px 24px;">
        <div class="main" style="width: 100%; padding: 0;">

            <!-- ===== SCHEDULE SECTION (Active) ===== -->
            <div id="scheduleSection">
                <div class="section-box">
                    <div class="section-header" style="background:transparent;color:#333;padding:12px 18px 0px;">
                        <h3 style="font-weight:700;margin-bottom:2px;font-size:18px;color:#222;">Schedule</h3>
                    </div>
                    <div style="padding:0 18px 18px;">
                        <div class="table-wrap" style="padding:0 4px;">
                            <table style="border:1px solid #e0e0e0;">
                                <thead>
                                    <tr style="background:#0d3461;color:white;">
                                        <th style="padding:12px 16px;border:1px solid #e0e0e0;font-size:13px;font-weight:600;">Blotter ID</th>
                                        <th style="padding:12px 16px;border:1px solid #e0e0e0;font-size:13px;font-weight:600;">Type Incident</th>
                                        <th style="padding:12px 16px;border:1px solid #e0e0e0;font-size:13px;font-weight:600;">Complainant</th>
                                        <th style="padding:12px 16px;border:1px solid #e0e0e0;font-size:13px;font-weight:600;">Respondent</th>
                                        <th style="padding:12px 16px;border:1px solid #e0e0e0;font-size:13px;font-weight:600;">Date & Time</th>
                                        <th style="padding:12px 16px;border:1px solid #e0e0e0;font-size:13px;font-weight:600;">Location</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="6" style="text-align:center;padding:36px 12px;color:#999;border:1px solid #e0e0e0;font-size:13px;">
                                            No schedules found.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- ========== FOOTER ========== -->
    <div class="footer">© 2026 Barangay Blotter</div>

    <script src="js/api.js"></script>
    <script src="js/nav-account.js"></script>
    <script src="js/Schedules.js"></script>
</body>
</html>
